name: Deep Front
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deep-front-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install locked dependencies without lifecycle scripts
        run: npx --yes npm@12.1.0 run inst -- --include=dev
      - run: npm run typecheck
      - name: Community accounts, admin authorization, and map publishing
        run: npx vitest run tests/server/Community.test.ts
      - name: Multiplayer server regression tests
        run: npx vitest run tests/server/Standalone.test.ts tests/server/MapPlaylistTrusted.test.ts tests/server/PrivateLobbyCap.test.ts tests/server/WorkerLobbyServiceClients.test.ts tests/core/ClusterConfig.test.ts
      - name: Peace time and combat regression tests
        run: npx vitest run tests/PeaceTime.test.ts tests/Attack.test.ts tests/core/executions/NukeExecution.test.ts tests/nukes/WaterNukes.test.ts tests/client/HostLobbyModalPeaceTime.test.ts tests/client/HostLobbyModalPlayerLimit.test.ts tests/client/ImmunityTimer.test.ts tests/client/HeadsUpMessage.test.ts tests/server/ConfigPatch.test.ts
      - name: Oil Factory and economy regression tests
        run: npx vitest run tests/economy/OilFactory.test.ts tests/economy/ConstructionCost.test.ts tests/economy/ConstructionGold.test.ts tests/core/executions/UpgradeStructureExecution.test.ts tests/FindAndUpgradeNearestBuilding.test.ts tests/AutoUpgrade.test.ts tests/core/snapshot/StructureExecutions.test.ts tests/client/PlayerStatsTable.test.ts tests/client/graphics/layers/BuildMenuCost.test.ts tests/client/controllers/BuildPreviewController.test.ts tests/ApiSchemas.test.ts tests/core/ApiSchemas.test.ts tests/core/IntentTileRefSchemas.test.ts tests/core/game/RailNetwork.test.ts
      - run: npm run build
      - name: DeepPlace and railroad trade validation
        run: npx vitest run tests/DeepPlace.test.ts tests/core/game/TrainStation.test.ts tests/core/game/Cluster.test.ts tests/TradeTrainScenarios.test.ts tests/core/executions/TrainExecution.test.ts
      - name: Resource buildings, AI and bomb regression tests
        run: npx vitest run tests/economy/CopperMine.test.ts tests/economy/LogisticsCenter.test.ts tests/economy/EconomyAI.test.ts tests/economy/ResourceBombs.test.ts tests/NationStructureBehavior.test.ts tests/core/snapshot/BasicExecutions.test.ts tests/core/snapshot/SnapshotFixtures.test.ts
      - name: Production dependency security check
        run: npx --yes npm@12.1.0 audit --omit=dev --audit-level=high
